name: Class 07 delivery

# Step 2: start a run only when main receives a push.
on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-09-22
        with:
          persist-credentials: false
      - name: Source contract
        run: python3 -m unittest -v
